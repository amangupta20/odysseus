services:
  odysseus:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - INSTALL_OPTIONAL=true
    volumes:
      - odysseus-data:/app/data:z
      - odysseus-logs:/app/logs:z
      - odysseus-ssh:/app/.ssh:z
      - odysseus-huggingface:/app/.cache/huggingface:z
      - odysseus-local:/app/.local:z
    environment:
      - GITHUB_PAT=${GITHUB_PAT}
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-http://onlyoffice:80}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ODYSSEUS_API_BASE=${ODYSSEUS_API_BASE:-http://odysseus:7000}
    depends_on:
      onlyoffice:
        condition: service_started

  onlyoffice:
    image: docker.io/onlyoffice/documentserver:latest
    container_name: onlyoffice-document-server
    restart: unless-stopped
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - JWT_HEADER=Authorization
    ports:
      - "${ONLYOFFICE_PORT_BIND:-127.0.0.1:8080}:80"

volumes:
  odysseus-data:
  odysseus-logs:
  odysseus-ssh:
  odysseus-huggingface:
  odysseus-local:
